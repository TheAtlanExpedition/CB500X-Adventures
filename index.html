<!DOCTYPE html>
<html>
<head>
    <title>My Practice Page</title>
    <section>
      <!-- FONTS -->
      <!-- Headers, Paragraphs and Figcaptions -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <!-- Titles -->
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
      <!-- CSS Style Rules to apply the font -->
      <style>
        h2,h3,h4,p,figcaption {
            font-family: "Edu NSW ACT Cursive", cursive;}
        h1 {
            font-family: "Merriweather:ital,opsz",merriweather;}
              .card {
    /* Tells the container to be exactly as wide as its widest content (the image) */
    width: min-content; 
    display: inline-block; /* Or use 'display: block' if you want it on its own line */}
            </style>
      </section>
</head>
<body>
  <section style="text-align: center;" class="card"
    <img src="https://raw.githubusercontent.com/TheAtlanExpedition/CB500X-Adventures/refs/heads/main/Images/20260704_122043.jpg" alt="Example image">> 
    <figure>  
    <h1>The Atlan Expedition</h1>
    <h2>My Adventures On The CB500X</h2>
    <h3>My first ride on dirt and with street tyres no less.</h3><h4 style="text-align: left;">Blackdown Tablelands</h4>
    <p style="text-align: left;">It was intimidating to start with but I'd already gotten some good advice online about standing, essentailly "stand when you don't want to and sit when it's easy".</p><p style="text-align: left;">The corrogation didn't help with the street tyres and pressures, I was slowing to a crawl around corners to avoid slipping on the gravel, keep in mind this was before I'd gotten any protection for me or the bike.</p>
    <img  src=https://raw.githubusercontent.com/TheAtlanExpedition/CB500X-Adventures/refs/heads/main/Images/20260704_122043.jpg  alt="CB500X on the way up blackdown tablelands."> <width="400">
    </figure>
    <figure>  
    <p style="text-align: left;">There were some great views around Blackdown Tablelands, this was on the way up the mountain on the side of the sealed road was a pitstop with some stones arranged for an unofficial camp fire.</p>
    <p style="text-align: left;">At the top of the mountain was an incredible view a short walk from the rest stop just before the road turned to dirt.</p>
    <img src=https://raw.githubusercontent.com/TheAtlanExpedition/CB500X-Adventures/refs/heads/main/Images/20260704_111719.jpg alt="View from top of Blackdown Tablelands."> <width="400">
    </figure>      
  </section>  

</body>
</html>
