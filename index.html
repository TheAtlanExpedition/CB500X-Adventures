    <h2>My Adventures On The CB500X</h2>
    <h3>My first ride on dirt and with street tyres no less.</h3><h4 style="text-align: left;">Blackdown Tablelands</h4>
    <p style="text-align: left;">It was intimidating to start with but I'd already gotten some good advice online about standing, essentailly "stand when you don't want to and sit when it's easy".</p><p style="text-align: left;">The corrogation didn't help with the street tyres and pressures, I was slowing to a crawl around corners to avoid slipping on the gravel, keep in mind this was before I'd gotten any protection for me or the bike.</p>
    <img  src=https://raw.githubusercontent.com/TheAtlanExpedition/CB500X-Adventures/refs/heads/main/Images/20260704_122043.jpg  alt="CB500X on the way up blackdown tablelands." class="responsive-img">
    </figure>

    <p style="text-align: left;">There were some great views around Blackdown Tablelands, this was on the way up the mountain on the side of the sealed road was a pitstop with some stones arranged for an unofficial camp fire.</p>
